services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-3001}
      ORG_TREE_MODE: ${ORG_TREE_MODE:-normal}
      ORG_TREE_DELAY_MS: ${ORG_TREE_DELAY_MS:-0}
      REALTIME_INTERVAL_MS: ${REALTIME_INTERVAL_MS:-1000}
      REALTIME_MODE: ${REALTIME_MODE:-generated}
    expose:
      - "${API_PORT:-3001}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:${API_PORT:-3001}/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 1s

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      API_PORT: ${API_PORT:-3001}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
